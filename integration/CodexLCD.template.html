<!DOCTYPE html>
<html><head><title>CodexLCD</title>
<meta description="Codex / 助手B 独立状态配色，助手B 饱和度增强；彩虹猫默认灯效。"/>
<meta publisher="Local GpuLcd Tool"/>
<meta property="previewState" label="Preview / LCD test" type="combobox" values="Auto,Working,Waiting,Done,Idle" default="Auto"/>
<meta property="intensity" label="Brightness" type="number" min="5" max="100" default="55"/>
</head><body style="margin:0;padding:0"><canvas id="exCanvas" width="320" height="200"></canvas></body>
<script>
var canvas=document.getElementById("exCanvas"),ctx=canvas.getContext("2d");
var state="idle",updated=Date.now(),lastPreview="Auto",manualState="",manualUntil=0,sequence=0;
var taskClient="codex",stateStarted=Date.now();
var idleDuration=5400,idleEpoch=Date.now(),lastShown="",idleSynced=false,idleRate=1;
var idlePalette=[[0,255,20,0],[900,255,151,0],[1800,255,239,0],[2700,10,238,0],[3600,0,150,255],[4500,101,63,255]];
function idleColors(now,position){
 var t=(((now-idleEpoch)*idleRate+(position||0)*idleDuration)%idleDuration+idleDuration)%idleDuration,i=0;
 if(idleDuration-t<.001)t=0;
 while(i+1<idlePalette.length && idlePalette[i+1][0]<=t+.001)i++;
 var a=idlePalette[i],b=idlePalette[(i+1)%idlePalette.length],end=i+1<idlePalette.length?b[0]:idleDuration;
 var mix=Math.max(0,Math.min(1,(t-a[0])/(end-a[0])));
 return a.slice(1).map(function(v,j){return v+(b[j+1]-v)*mix;});
}
var blackout=false;
try{blackout=localStorage.getItem("GpuLcdNightMode")==="1";}catch(error){}
function valid(s){return ["idle","working","waiting","done"].indexOf(s)>=0;}
function onCanvasApiEvent(e){
 if(e.sender!=="GpuLcdTool")return;

 var name=e.event;
 if(typeof name!=="string" || name.length>100)return;
 try{name=decodeURIComponent(name);}catch(error){return;}
 if(name==="sleep" || name==="wake"){
  blackout=name==="sleep";
  try{localStorage.setItem("GpuLcdNightMode",blackout?"1":"0");}catch(error){}
  if(!blackout){manualUntil=0;lastPreview=typeof previewState==="string"?previewState:"Auto";}
  console.log("GpuLcdBlackout="+(blackout?"on":"off")+";ts="+Date.now());
  return;
 }
 var incomingClient="codex",scoped=/^(asst|codex)@(working|waiting|done)$/.exec(name);
 if(scoped){incomingClient=scoped[1];name=scoped[2];}
 var sync=/^idle@(\d{12,14})@(-?\d{1,4})(?:@(\d{2,3}(?:\.\d{1,2})?))?$/.exec(name);
 if(sync){
  var epoch=Number(sync[1]),offset=Number(sync[2]),rate=sync[3]===undefined?1:Number(sync[3])/100;
  if(!isFinite(epoch)||Math.abs(offset)>5000||rate<.95||rate>1.05)return;
  name="idle";idleRate=rate;idleEpoch=epoch-offset/rate;idleSynced=true;
  console.log("GpuLcdSync="+epoch+";offset="+offset+";rate="+rate);
 }else if(valid(name))idleSynced=false;
 if(valid(name)){
  if(name!==state || incomingClient!==taskClient)stateStarted=Date.now();
  taskClient=incomingClient;
  state=name;updated=Date.now();
  console.log("GpuLcdState="+state+";seq="+(++sequence)+(taskClient==="asst"?";client=asst":""));
 }
}
function poll(now){
 var preview=typeof previewState==="string"?previewState:"Auto";
 if(preview!==lastPreview){
  lastPreview=preview;
  if(valid(preview.toLowerCase())){manualState=preview.toLowerCase();manualUntil=now+8000;}
  else manualUntil=0;
 }
}
function idleSaturation(rgb){
 var hi=Math.max.apply(null,rgb),lo=Math.min.apply(null,rgb);
 if(hi===0 || (hi-lo)/hi<.08)return rgb;
 var factor=Math.min(1.15,hi/(hi-lo));
 return rgb.map(function(v){return hi-(hi-v)*factor;});
}
function update(){
 if(blackout){ctx.fillStyle="rgb(0,0,0)";ctx.fillRect(0,0,320,200);window.requestAnimationFrame(update);return;}
 var now=Date.now();poll(now);if(now-updated>45000)state="idle";
 var colors={working:[50,157,245],waiting:[242,169,42],done:[34,207,92],idle:[40,220,196]};
 var shown=now<manualUntil?manualState:state;
 var is助手B=now>=manualUntil && taskClient==="asst" && shown!=="idle";
 if(is助手B)colors={working:[217,99,61],waiting:[240,170,31],done:[96,200,96]};
 if(shown!==lastShown){if(shown==="idle" && !idleSynced)idleEpoch=now;lastShown=shown;}
 var color=colors[shown],strength=(typeof intensity==="number"?intensity:55)/100;
 var pulse=shown==="working"?.65+.35*Math.sin(now/1100):shown==="waiting"?.65+.25*Math.sin(now/700):shown==="done"?.75+.25*Math.cos(now/500):.45;
 if(is助手B){
  var age=Math.max(0,now-stateStarted);
  pulse=shown==="working"?.75+.25*Math.sin(age*Math.PI/1260):shown==="waiting"?.35+.65*(.5+.5*Math.sin(age*Math.PI/960)):.55+.45*Math.min(1,age/1000);
 }
 var k=strength*pulse;
 ctx.fillStyle="rgb("+color.map(function(v){return Math.round(v*k);}).join(",")+")";
 ctx.fillRect(0,0,320,200);
 if(shown==="idle"){
  for(var stripe=0;stripe<64;stripe++){
   var palette=idleSaturation(idleColors(now,stripe/64));
   ctx.fillStyle="rgb("+palette.map(function(v){return Math.round(v*k);}).join(",")+")";
   ctx.fillRect(stripe*5,0,5,200);
  }
 }
 if(shown==="working"){
  var x=(now/18)%440-60,g=ctx.createLinearGradient(x-60,0,x+60,0);
  var glow=is助手B?"217,99,61":"80,180,255";
  g.addColorStop(0,"rgba("+glow+",0)");g.addColorStop(.5,"rgba("+glow+",0.12)");g.addColorStop(1,"rgba("+glow+",0)");
  ctx.fillStyle=g;ctx.fillRect(x-60,0,120,200);
 }
 window.requestAnimationFrame(update);
}
window.requestAnimationFrame(update);
</script></html>
